server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:exportrace.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 / SQL script execution if needed
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=9a4f2c8d7b6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0
jwt.expiration=86400000

# Logging
logging.level.com.exportrace=INFO
logging.level.org.springframework.security=WARN
