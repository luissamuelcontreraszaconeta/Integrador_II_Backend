server.port=${PORT:8080}

# SQLite Database Configuration (supports cloud persistent disk or container path)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:exportrace.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 / SQL script execution if needed
spring.sql.init.mode=never

# CORS Configuration (comma separated list of origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:80,https://exportrace-frontend.onrender.com}

# JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d7b6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cold Chain Configuration
coldchain.max-reading-age-hours=${COLD_CHAIN_MAX_READING_AGE_HOURS:12}

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:data/uploads}

# Jira Service Management Cloud Integration (Fase C)
# Safe default: disabled (false) for local development and automated test suites.
# Never commit real tokens or credentials to version control.
jira.enabled=${JIRA_ENABLED:false}
jira.base-url=${JIRA_BASE_URL:}
jira.service-desk-id=${JIRA_SERVICE_DESK_ID:}
jira.request-type-id=${JIRA_REQUEST_TYPE_ID:}
jira.account-email=${JIRA_ACCOUNT_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}
jira.correlation-field-id=${JIRA_CORRELATION_FIELD_ID:}
jira.exportrace-code-field-id=${JIRA_EXPORTRACE_CODE_FIELD_ID:}
jira.connect-timeout-seconds=${JIRA_CONNECT_TIMEOUT_SECONDS:5}
jira.read-timeout-seconds=${JIRA_READ_TIMEOUT_SECONDS:10}

# Logging
logging.level.com.exportrace=INFO
logging.level.org.springframework.security=WARN

